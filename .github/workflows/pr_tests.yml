name: Pull Request Tests

# Runs on every pull request to validate code changes
on:
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
      
      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Test imports
        run: |
          python -c "import sys; sys.path.append('src'); from config import *"
          python -c "import sys; sys.path.append('src'); from aqi_utils import *"
          python -c "import sys; sys.path.append('src'); from fetch_data import *"
      
      - name: Validate configuration
        run: |
          python -c "from src.config import LAT, LON; assert LAT == 24.8607; assert LON == 67.0011"
      
      - name: Check file structure
        run: |
          test -f src/run_feature_pipeline.py
          test -f src/train_model.py
          test -f src/generate_predictions.py
          test -f src/backfill_data.py
          test -f streamlit_app/app.py
          echo "✅ All required files present"

  test-pipelines:
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test AQI calculations
        run: |
          python -c "
          from src.aqi_utils import compute_aqi_from_row, calculate_european_aqi
          test_row = {
              'pm2_5': 35.0, 'pm10': 80.0,
              'nitrogen_dioxide': 40.0, 'ozone': 60.0,
              'sulphur_dioxide': 20.0, 'carbon_monoxide': 5.0
          }
          us_result = compute_aqi_from_row(test_row)
          eu_result = calculate_european_aqi(test_row)
          assert us_result['aqi'] > 0, 'US AQI calculation failed'
          assert eu_result['european_aqi'] > 0, 'EU AQI calculation failed'
          print('✅ AQI calculations working')
          "
      
      - name: Test data fetching (dry run)
        env:
          SAVE_LOCAL: false
        run: |
          python -c "
          from src.config import AIR_QUALITY_URL, WEATHER_FORECAST_URL
          print(f'Air Quality API: {AIR_QUALITY_URL}')
          print(f'Weather API: {WEATHER_FORECAST_URL}')
          print('✅ API URLs configured correctly')
          "
      
      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Code quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- Import tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- AQI calculations validated" >> $GITHUB_STEP_SUMMARY
          echo "- File structure verified" >> $GITHUB_STEP_SUMMARY
