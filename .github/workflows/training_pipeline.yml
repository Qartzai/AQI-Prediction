name: Weekly Model Training

# Runs weekly on Sundays at 3:30 AM UTC to retrain models
on:
  schedule:
    - cron: '30 3 * * 0'  # Every Sunday at 3:30 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  train-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Train Models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python src/train_model.py
      
      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            models/*.pkl
          retention-days: 30
      
      - name: Create model performance report
        if: success()
        run: |
          echo "## Model Training Report" >> $GITHUB_STEP_SUMMARY
          echo "Training completed at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Models saved to artifacts" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload logs (if failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: |
            *.log
            logs/*.log
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Model training failed! Check logs for details."